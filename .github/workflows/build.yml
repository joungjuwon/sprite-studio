name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt

      # PyInstaller 실행부(bootloader)를 여기서 직접 컴파일한다. 미리 만들어진
      # 실행부는 악성 프로그램도 똑같이 쓰기 때문에 백신이 머신러닝 판정으로
      # 오탐(Trojan:Win32/Wacatac.B!ml 등)하는 일이 잦다.
      - name: Install PyInstaller with a locally built bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller --no-cache-dir "pyinstaller==6.22.2"

      # dist/ 는 실행 위치 기준이라, desktop/build.py 와 같은 자리에 떨어지도록 지정한다.
      # 태그 이름(v1.2.1)이 exe 의 버전 정보가 된다.
      - name: Build
        env:
          SPRITE_STUDIO_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0' }}
        run: >
          python -m PyInstaller desktop/sprite_studio.spec --noconfirm --clean
          --distpath desktop/dist --workpath desktop/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteStudio-windows
          path: desktop/dist/SpriteStudio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SpriteStudio.exe
