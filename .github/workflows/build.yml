name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt pyinstaller

      # dist/ 는 실행 위치 기준이라, desktop/build.py 와 같은 자리에 떨어지도록 지정한다
      - name: Build
        run: >
          python -m PyInstaller desktop/sprite_studio.spec --noconfirm --clean
          --distpath desktop/dist --workpath desktop/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpriteStudio-windows
          path: desktop/dist/SpriteStudio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SpriteStudio.exe
