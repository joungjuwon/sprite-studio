<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Studio</title>
<meta name="description" content="스프라이트 시트에서 스프라이트를 추출하는 도구. 브라우저에서 바로 실행되며 이미지는 업로드되지 않습니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <h1>Sprite Studio <span class="tag">web</span></h1>
  <div class="bar-right">
    <select id="lang" title="언어">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
    <a class="ghost" href="https://github.com/joungjuwon/sprite-studio/releases/latest" data-i18n="desktop">데스크톱 버전</a>
  </div>
</header>

<div id="boot">
  <div class="boot-inner">
    <div class="spin" aria-hidden="true"></div>
    <p id="boot-msg">준비하는 중…</p>
    <p class="boot-sub">파이썬 엔진을 내려받고 있습니다. 처음 한 번만 걸립니다.</p>
  </div>
</div>

<main id="app" hidden>
  <section id="stage">
    <div id="drop">
      <div class="drop-inner">
        <p class="big" data-i18n="dropTitle">시트 이미지를 끌어다 놓으세요</p>
        <p class="dim" data-i18n="dropSub">PNG · JPG · BMP · GIF · WEBP · TGA — 이미지는 이 브라우저 밖으로 나가지 않습니다</p>
        <button id="pick" class="primary" data-i18n="pickFile">파일 선택</button>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
    </div>
    <canvas id="view" hidden></canvas>
    <div id="hud" hidden></div>
  </section>

  <aside id="side" hidden>
    <div class="row">
      <strong id="sheet-name">—</strong>
      <span class="dim" id="sheet-size"></span>
    </div>

    <fieldset>
      <legend data-i18n="opts">추출 옵션</legend>

      <label class="check">
        <input type="checkbox" id="use-bg">
        <span data-i18n="bgColor">배경색 지정</span>
      </label>
      <div class="row indent">
        <input type="color" id="bg" value="#ff00ff" disabled>
        <button id="eyedrop" class="ghost" disabled data-i18n="eyedrop">스포이트</button>
      </div>

      <label>
        <span data-i18n="tol">배경 허용 오차</span> <output id="tol-v">10</output>
        <input type="range" id="tol" min="0" max="120" value="10">
      </label>
      <label>
        <span data-i18n="merge">조각 합치기</span> <output id="merge-v">0</output>
        <input type="range" id="merge" min="0" max="16" value="0">
      </label>
      <label>
        <span data-i18n="minSize">최소 가로·세로</span> <output id="minsize-v">2</output>
        <input type="range" id="minsize" min="1" max="64" value="2">
      </label>
      <label>
        <span data-i18n="minArea">최소 면적</span> <output id="minarea-v">4</output>
        <input type="range" id="minarea" min="1" max="400" value="4">
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="exportOpts">내보내기</legend>
      <label>
        <span data-i18n="pad">여백</span> <output id="pad-v">0</output>
        <input type="range" id="pad" min="0" max="32" value="0">
      </label>
      <label class="check">
        <input type="checkbox" id="square">
        <span data-i18n="square">정사각형으로 맞추기</span>
      </label>
      <label class="check">
        <input type="checkbox" id="with-json" checked>
        <span data-i18n="withJson">좌표 JSON 함께 저장</span>
      </label>
    </fieldset>

    <div class="row wrap">
      <button id="all" class="ghost" data-i18n="selectAll">전체 선택</button>
      <button id="none" class="ghost" data-i18n="selectNone">선택 해제</button>
    </div>
    <button id="save" class="primary wide" disabled>
      <span data-i18n="save">선택한 스프라이트 저장</span>
    </button>
    <button id="reset" class="ghost wide" data-i18n="other">다른 시트 열기</button>

    <p class="hint" data-i18n="hint">
      휠 = 확대 · 드래그 = 이동 · 클릭 = 선택 · 빈 곳 더블클릭 = 화면 맞춤
    </p>
  </aside>
</main>

<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="app.js"></script>
</body>
</html>
